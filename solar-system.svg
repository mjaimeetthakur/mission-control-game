<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" style="background:#0a0a10">
  <defs>
    <radialGradient id="sun">
      <stop stop-color="#fff5c5"/>
      <stop offset=".18" stop-color="#ffce91"/>
      <stop offset=".55" stop-color="#ffad76"/>
      <stop offset="1" stop-color="#df795f"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#ff9e7b" stop-opacity=".36"/>
      <stop offset=".45" stop-color="#735bb8" stop-opacity=".17"/>
      <stop offset="1" stop-color="#514079" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mercury" cx=".28" cy=".24">
      <stop stop-color="#f8d7af"/><stop offset="1" stop-color="#7c706d"/>
    </radialGradient>
    <radialGradient id="venus" cx=".3" cy=".26">
      <stop stop-color="#ffe2aa"/><stop offset=".65" stop-color="#e98c72"/><stop offset="1" stop-color="#a56e68"/>
    </radialGradient>
    <radialGradient id="earth" cx=".28" cy=".22">
      <stop stop-color="#a7e8d0"/><stop offset=".52" stop-color="#56a8b7"/><stop offset="1" stop-color="#344b83"/>
    </radialGradient>
    <radialGradient id="mars" cx=".28" cy=".24">
      <stop stop-color="#ffd49d"/><stop offset=".62" stop-color="#df765f"/><stop offset="1" stop-color="#873e58"/>
    </radialGradient>
    <radialGradient id="jupiter" cx=".29" cy=".2">
      <stop stop-color="#f6ddb5"/><stop offset=".75" stop-color="#cb927d"/><stop offset="1" stop-color="#625a70"/>
    </radialGradient>
    <radialGradient id="saturn" cx=".3" cy=".22">
      <stop stop-color="#f6e1ad"/><stop offset=".7" stop-color="#cba879"/><stop offset="1" stop-color="#665f70"/>
    </radialGradient>
    <radialGradient id="ice" cx=".3" cy=".22">
      <stop stop-color="#dbf2ee"/><stop offset=".7" stop-color="#8ec6d0"/><stop offset="1" stop-color="#546a91"/>
    </radialGradient>
    <radialGradient id="neptune" cx=".3" cy=".2">
      <stop stop-color="#c4daf6"/><stop offset=".68" stop-color="#697fc1"/><stop offset="1" stop-color="#3d416e"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="planetShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ring">
      <stop stop-color="#a995ff" stop-opacity=".02"/>
      <stop offset=".42" stop-color="#d2c4ff" stop-opacity=".58"/>
      <stop offset=".6" stop-color="#e7e0ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a995ff" stop-opacity=".04"/>
    </linearGradient>
  </defs>
