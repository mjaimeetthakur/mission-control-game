  </g>
  <circle cx="1035" cy="390" r="45" fill="url(#sun)" filter="url(#planetShadow)"/>
  <path d="M1012 356c12-8 26-11 38-9" stroke="#fff4d5" stroke-opacity=".52" stroke-width="3" stroke-linecap="round"/>
  <g class="orbiting-planet mercury-orbit" data-orbit-seconds="18" data-orbit-radius-x="72" data-orbit-radius-y="48" data-orbit-start-x="1104" data-orbit-start-y="374">
